name: citygen gates
on:
  push:
    branches-ignore: [media]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  citygen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: cargo test -p citygen
        shell: bash
        run: set -o pipefail; cargo test --locked --no-fail-fast -p citygen 2>&1 | tee test.log
      - name: Test counts
        if: always()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep "^test result:" > results.txt || true
          {
            echo '```'
            cat results.txt
            awk '{for (i = 1; i < NF; i++) { if ($(i+1) ~ /^passed/) p += $i; if ($(i+1) ~ /^failed/) f += $i; if ($(i+1) ~ /^ignored/) g += $i }} END {printf "total: %d passed, %d failed, %d ignored, %d binaries\n", p, f, g, NR}' results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk '{for (i = 1; i < NF; i++) if ($(i+1) ~ /^passed/) p += $i} END {if (p == 0) {print "no tests passed"; exit 1}}' results.txt
