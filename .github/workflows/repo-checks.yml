name: repo checks
on:
  push:
    branches-ignore: [media]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          assets: "true"
      - name: install fonttools
        shell: bash
        run: pip install fonttools==4.59.1
      - name: tree_check (headless boundary, pinned render deps)
        if: success() || failure()
        shell: bash
        run: python tools/qa/tree_check.py
      - name: font_check (UI glyphs in Inter)
        if: success() || failure()
        shell: bash
        run: python tools/qa/font_check.py
      - name: test_brp (BRP send_keys guard)
        if: success() || failure()
        shell: bash
        run: python -m unittest tools/qa/test_brp.py
