[package]
name = "gta_sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bevy = { workspace = true, features = ["std", "multi_threaded", "bevy_state", "bevy_log", "bevy_asset", "serialize", "reflect_auto_register"] }
