[package]
name = "gta_sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
citygen = { path = "../citygen" }
bevy = { workspace = true, features = ["std", "multi_threaded", "bevy_state", "bevy_log", "bevy_asset", "serialize", "reflect_auto_register"] }
avian3d = { workspace = true }
bevy-tnua = { workspace = true }
bevy-tnua-avian3d = { workspace = true }
pathfinding = "=4.16.0"
rand_chacha = { version = "=0.10.0", default-features = false }
ron = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
bevy = { workspace = true, features = ["debug"] }
sha2 = "=0.10.9"
